<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Polonsky Family Tree</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The Polonsky family tree">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Archive palette: Wall of Honor slate green, aged paper, brass for the person in focus.
     Layout: full-bleed pan/zoom canvas, slim header, floating controls, detail drawer. */
  --bg:#e9ece7;
  --grid:#d7ddd5;
  --surface:#fbfcfa;
  --ink:#1b2420;
  --muted:#5f6b65;
  --line:#8a968f;
  --accent:#2f4a3e;
  --accent-ink:#f3f6f2;
  --brass:#a87f3e;
  --ok:#3f7a52;
  --story:#b07a1e;
  --research:#6d7f96;
  --danger:#a8423a;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 18px rgba(20,30,25,.08);
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815;--grid:#1c2420;--surface:#1b2420;--ink:#e6ebe7;--muted:#9aa69f;--line:#5b6a62;
    --accent:#8fb8a2;--accent-ink:#0f1512;--brass:#d2a65f;--ok:#7cc492;--story:#e0aa4a;--research:#93a8c4;--danger:#e07a70;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815;--grid:#1c2420;--surface:#1b2420;--ink:#e6ebe7;--muted:#9aa69f;--line:#5b6a62;
  --accent:#8fb8a2;--accent-ink:#0f1512;--brass:#d2a65f;--ok:#7cc492;--story:#e0aa4a;--research:#93a8c4;--danger:#e07a70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--grid)}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap}
.search{position:relative;flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);padding:0 12px 0 34px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto;display:none;padding:4px}
.results.show{display:block}
.results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px;border-radius:8px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results .meta{color:var(--muted);font-size:12px}
.hbtn{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn svg{width:16px;height:16px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--story)} .sync.local i{background:var(--research)}

/* Canvas */
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#world svg path{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#world svg path.couple{stroke:var(--brass);stroke-width:2}

.card{position:absolute;width:184px;height:100px;background:var(--surface);border:1px solid var(--grid);border-radius:14px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:center;padding:10px 12px 10px 10px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line)}
.card.focus{border:2px solid var(--brass);box-shadow:0 0 0 5px color-mix(in srgb,var(--brass) 18%,transparent),var(--shadow)}
.card.research{border-style:dashed}
.ph{flex:none;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:22px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:600;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.yr{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.yr.none{color:var(--muted);font-style:italic}
.pl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.dot.confirmed{background:var(--ok)} .dot.story{background:var(--story)} .dot.research{background:transparent;border:1.5px solid var(--research)}
.role{position:absolute;bottom:-9px;left:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--muted);padding:1px 6px;border-radius:6px;border:1px solid var(--grid)}
.add{position:absolute;width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;line-height:1;box-shadow:var(--shadow);z-index:2}
.add:hover{transform:scale(1.08)}
.add.up{top:-14px;left:78px}.add.down{bottom:-14px;left:78px}.add.right{right:-14px;top:14px}.add.left{left:-14px;top:14px}
.add span{pointer-events:none}

/* Floating controls */
.ctl{position:fixed;left:16px;bottom:16px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:flex;align-items:center;background:var(--surface);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow);height:40px;padding:0 4px}
.pill button{border:0;background:none;height:32px;min-width:32px;border-radius:8px;display:grid;place-items:center}
.pill button:hover{background:var(--bg)}
.pill label{font-size:12px;color:var(--muted);padding:0 6px 0 8px}
.pill output{min-width:16px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.legend{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:14px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{position:static}

/* Panel */
#panel{position:fixed;z-index:40;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
@media (min-width:761px){#panel{top:var(--hh,59px);right:0;bottom:0;width:400px;border-left:1px solid var(--grid);transform:translateX(105%)}#panel.open{transform:none}}
@media (max-width:760px){#panel{left:0;right:0;bottom:0;height:calc(100% - var(--hh,60px));border-radius:18px 18px 0 0;border-top:1px solid var(--grid);transform:translateY(105%)}#panel.open{transform:translateY(var(--sheet-off,0px))}#panel.dragging{transition:none}
  .legend{display:none}.brand small{display:none}.brand b{font-size:21px}.hbtn .lbl{display:none}.sync .lbl{display:none}}
.p-head{display:flex;gap:14px;align-items:center;padding:18px 18px 12px;border-bottom:1px solid var(--grid)}
.p-head .big{width:76px;height:76px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--accent) 14%,var(--surface));display:grid;place-items:center;overflow:hidden;font-family:var(--font-display);font-size:32px;color:var(--accent);position:relative}
.p-head .big img{width:100%;height:100%;object-fit:cover}
.p-head h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.p-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.p-head .x{margin-left:auto;align-self:flex-start;border:0;background:none;width:34px;height:34px;border-radius:8px;font-size:22px;color:var(--muted)}
.p-body{overflow:auto;padding:6px 18px 28px;flex:1}
.sec{padding:14px 0;border-bottom:1px solid var(--grid)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld textarea{border:1px solid var(--grid);border-radius:9px;background:var(--bg);padding:8px 10px;min-height:38px;width:100%}
.fld textarea{min-height:92px;resize:vertical;line-height:1.45}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--grid);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg .dot{position:static}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.rel{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rel .lab{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--grid);border-radius:999px;background:var(--bg);overflow:hidden}
.chip button{border:0;background:none;padding:5px 10px;font-size:13px}
.chip button.un{padding:5px 8px 5px 2px;color:var(--muted)}
.chip button.un:hover{color:var(--danger)}
.chip.confirm{border-color:var(--danger)}
.chip.confirm button{color:var(--danger)}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--grid);background:var(--bg);border-radius:9px;padding:7px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:12px}
.photoacts{display:flex;gap:6px;margin-top:8px}
.muted{color:var(--muted);font-size:13px}
.saved{font-size:11px;color:var(--ok);text-transform:none;letter-spacing:0;font-weight:500;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* Modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,12,.38);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(440px,100%);max-height:90%;overflow:auto;padding:20px}
.dlg h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 0 4px}
.dlg .muted{margin-bottom:14px}
.dlg .tabs{display:flex;gap:6px;margin-bottom:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pick{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;margin-top:8px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:6px;border-radius:9px}
.pick button:hover,.pick button[aria-pressed="true"]{background:var(--bg);border-color:var(--grid)}
.pick .ph,.results .ph{width:32px;height:32px;font-size:15px}

/* Toast, banners, empty */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;transition:all .25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}
.banner{position:fixed;top:calc(var(--hh,59px) + 7px);left:50%;transform:translateX(-50%);z-index:25;background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);display:none;max-width:92%}
.banner.show{display:block}
.empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px}
.empty.show{display:flex}
.empty h2{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0}
.gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg);
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
.gate.show{display:flex}
.gcard{background:var(--surface);border:1px solid var(--grid);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gcard h2{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
.gcard p{margin:0;line-height:1.5}
.btn.big{padding:11px 18px;font-size:15px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--grid);border-radius:10px;background:var(--bg)}
.mrow .mem{font-weight:500;flex:1;min-width:160px;word-break:break-all}
#world svg path.couple.divorced,#world svg path.couple.separated{stroke-dasharray:6 6;stroke:var(--line)}
#world svg path.couple.widowed{stroke-dasharray:2 5}
#world svg path.uncertain{stroke-dasharray:3 5;stroke:var(--research)}
.nee{font-size:11.5px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ulabel{position:absolute;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:1px 5px;border-radius:5px;border:1px solid var(--grid);pointer-events:none;white-space:nowrap}
.p-head h2.editable{cursor:text}
.p-head .ename{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0;text-decoration:underline;cursor:pointer}
.chip .ust{font-size:11px;color:var(--muted);padding-right:8px}
@media (max-width:760px){
  .fld input,.fld textarea,.search input,.dlg input{font-size:16px}
}
.pill .vbtn{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;font-weight:500}
.pill .vbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body.allview .pill.gen{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.yaxis{position:fixed;left:0;top:calc(var(--hh,59px) + 2px);bottom:0;width:92px;z-index:10;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 92%,transparent) 60%,transparent);display:none}
.yaxis.show{display:block}
.yaxis .yh{position:absolute;left:14px;top:10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.yaxis .yl{position:absolute;left:14px;transform:translateY(-50%);font-family:var(--font-display);font-size:21px;line-height:1;color:var(--muted);white-space:nowrap}
.yaxis.anim .yl{transition:top .5s cubic-bezier(.2,.7,.2,1),opacity .2s}
@media (max-width:760px){.yaxis{width:62px}.yaxis .yl{font-size:13px;left:6px}.yaxis .yh{left:6px;font-size:9.5px}}
.lock{position:absolute;bottom:7px;right:7px;width:22px;height:22px;border:0;border-radius:50%;background:var(--bg);color:var(--muted);display:grid;place-items:center;padding:0;cursor:pointer}
.lock svg{width:12px;height:12px}
.note{background:#f3f0e6;border:1px solid #e4ddca;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--ink);margin-bottom:12px}
.note b{font-weight:600}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4;margin:6px 0 0 26px}
.help ul{padding-left:18px;margin:10px 0}
.help li{margin:7px 0;font-size:14px;line-height:1.45}

/* Header menu (phones) */
#menuBtn{display:none}
#invHdrBtn{display:none}
body.caninvite #invHdrBtn{display:inline-flex}
.menu{position:fixed;right:12px;top:calc(var(--hh,59px) - 4px);z-index:45;background:var(--surface);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:none;flex-direction:column}
.menu.show{display:flex}
.menu .mi{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0 12px;min-height:44px;border-radius:8px;font-size:15px}
.menu .mi:hover{background:var(--bg)}
.menu .mi svg{width:18px;height:18px;color:var(--muted)}
.menu .mstat{font-size:12.5px;color:var(--muted);padding:6px 12px 8px;border-bottom:1px solid var(--grid);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.menu .mstat i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.menu .mstat.ok i{background:var(--ok)} .menu .mstat.busy i{background:var(--story)} .menu .mstat.local i{background:var(--research)}

/* View switch and options */
.pill.views{padding:0 4px;gap:2px}
.pill .vbtn{white-space:nowrap}
.pill.views .vbtn svg{width:15px;height:15px}
.pill.zoom .zfit{display:grid}
#optBtn{display:none}
body.allview #optBtn,body.mapview #optBtn,body.mapview .pill.gen,body.mapview .pill.zoom{display:none!important}
body.mapview .legend,body.mapview .yaxis{display:none!important}
.optrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--grid)}
.optrow:last-of-type{border-bottom:0}
.optrow .st{display:flex;align-items:center;gap:6px}
.optrow .st button{width:44px;height:44px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);font-size:20px}
.optrow output{min-width:26px;text-align:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}

/* Bottom sheet handle */
.grab{display:none}
@media (max-width:760px){
  header{padding:8px 12px;gap:8px}
  .brand{display:none}
  .search{margin-left:0;max-width:none}
  .search input{height:44px;font-size:16px}
  .search svg{top:14px}
  .results{top:50px;max-height:60vh}
  .results button{min-height:48px}
  .hbtn{height:44px;min-width:44px;padding:0 11px}
  #helpBtn,#authBtn,.sync,body.caninvite #invHdrBtn{display:none}
  #menuBtn{display:inline-flex}
  .ctl{left:10px;right:10px;bottom:12px;flex-wrap:nowrap;gap:6px}
  .pill{height:48px}
  .pill button{height:40px;min-width:44px}
  .pill .vbtn{padding:0 9px;gap:5px;white-space:nowrap}
  .pill.gen,.pill.zoom .zpm{display:none}
  .pill.zoom{padding:0 4px}
  #optBtn{display:flex;width:48px;justify-content:center;padding:0}
  .p-head .x{width:44px;height:44px}
  .grab{display:block;flex:none;height:22px;cursor:grab;touch-action:none;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--grid)}

/* ---------- layout ---------- */
let L = null;
function layout(fid) {
  const nodes = [], paths = [];
  const seg = (x1, y1, x2, y2, cls, pair) => paths.push({ d: `M${x1} ${y1}L${x2} ${y2}`, cls, pair, mid: pair ? [(x1 + x2) / 2, y1] : null });

  const up = state.up, down = state.down;
  sibs.forEach((s, i) => nodes.push({ id: s, x: -(sibs.length - i) * U, y: 0, role: "sib" }));
  nodes.push({ id: fid, x: 0, y: 0, role: "focus" });
  parts.forEach((p, i) => { nodes.push({ id: p, x: (i + 1) * U, y: 0, role: "partner" }); seg(i * U + CW / 2, 0, (i + 1) * U - CW / 2, 0, "couple", [fid, p]); });

  // ancestors
  const wMemo = new Map();
  const W = (id, g) => { const k = id + "|" + g; if (wMemo.has(k)) return wMemo.get(k); const ps = g < up ? parentsOf(id) : []; const w = ps.length ? ps.reduce((a, p) => a + W(p, g + 1), 0) : 1; wMemo.set(k, w); return w; };

    const ps = g < up ? parentsOf(id) : [];
    let x;
    if (ps.length) {
      let s = start;
      const xs = ps.map(p => { const w = W(p, g + 1); const px = place(p, s, g + 1); s += w * U; return px; });
      x = xs.reduce((a, b) => a + b, 0) / xs.length;
      const py = -(g + 1) * RH;
      const unc = (P(id).uncertain || []).some(u => ps.includes(u)) ? "uncertain" : undefined;
      if (xs.length === 2) { seg(xs[0] + CW / 2, py, xs[1] - CW / 2, py, "couple", ps); seg(x, py, x, -g * RH - CH / 2, unc); }
      else seg(x, py + CH / 2, x, -g * RH - CH / 2, unc);

  };
  const fpar = up >= 1 ? parentsOf(fid) : [];
  let fRight = U / 2;
  if (fpar.length) {
    const gc = sibs.length ? -sibs.length * U / 2 : 0;
    const total = fpar.reduce((a, p) => a + W(p, 1), 0);
    let s = gc - total * U / 2;
    if (parts.length && up >= 1 && parentsOf(parts[0]).length) s = Math.min(s, U / 2 - total * U);
    fRight = s + total * U;
    const xs = fpar.map(p => { const w = W(p, 1); const x = place(p, s, 1); s += w * U; return x; });

    if (xs.length === 2) seg(xs[0] + CW / 2, py, xs[1] - CW / 2, py, "couple", fpar);
    seg(pm, xs.length === 2 ? py : py + CH / 2, pm, busY);
    const kx = [...sibs.map((_, i) => -(sibs.length - i) * U), 0];
    seg(Math.min(pm, ...kx), busY, Math.max(pm, ...kx), busY);
    kx.forEach(x => seg(x, busY, x, -CH / 2));
  }

  // the first partner's ancestors, so both sides of a couple show
  const ppar = parts.length && up >= 1 ? parentsOf(parts[0]) : [];
  if (ppar.length) {
    const totalP = ppar.reduce((a, p) => a + W(p, 1), 0);
    let s2 = Math.max(U - totalP * U / 2, fpar.length ? fRight : U / 2);
    const xs = ppar.map(p => { const w = W(p, 1); const x = place(p, s2, 1); s2 += w * U; return x; });
    const pm = xs.reduce((a, b) => a + b, 0) / xs.length, py = -RH, busY = -RH / 2 - 10;
    if (xs.length === 2) seg(xs[0] + CW / 2, py, xs[1] - CW / 2, py, "couple", ppar);
    seg(pm, xs.length === 2 ? py : py + CH / 2, pm, busY);
    seg(Math.min(pm, U), busY, Math.max(pm, U), busY);
    seg(U, busY, U, -CH / 2);
  }

  // descendants
  const dMemo = new Map();
  const DW = (id, g) => { const k = id + "|" + g; if (dMemo.has(k)) return dMemo.get(k); const own = partnersOf(id).length ? 2 : 1; const ks = g < down ? childrenOf(id) : []; const kw = ks.reduce((a, c) => a + DW(c, g + 1), 0); const w = Math.max(own, kw); dMemo.set(k, w); return w; };

}

/* ---------- whole tree (bird's eye) layout ---------- */

  if (kind === "sibling" && !parentsOf(id).length) return toast("Add a parent first. Siblings share a parent in the tree.");

  const title = kind === "first" ? "Add the first person" : `Add ${kind === "parent" ? "a parent" : kind === "child" ? "a child" : kind === "partner" ? "a partner" : "a sibling"}`;
  const sub = p ? `${kind[0].toUpperCase() + kind.slice(1)} of ${fullName(p)}` : "You can add details after.";
  const draw = () => {
    const tabs = kind === "first" ? null : h("div", { class: "seg tabs" },
      h("button", { "aria-pressed": String(tab === "new"), onclick: () => { tab = "new"; draw(); }, text: "New person" }),
      h("button", { "aria-pressed": String(tab === "link"), onclick: () => { tab = "link"; draw(); }, text: "Already in the tree" }));
    let content;
    if (tab === "new") {
      content = h("div", { class: "grid2" },
        mf("a-given", "Given names"), mf("a-surname", "Surname"), mf("a-bdate", "Birth date", "e.g. abt 1882"), mf("a-bplace", "Birth place"));
    } else {
      const sIn = h("input", { type: "search", id: "a-find", placeholder: "Type a name", autocomplete: "off" });
      const list = h("div", { class: "pick" });
      const exclude = new Set([id, ...parentsOf(id), ...partnersOf(id), ...childrenOf(id)]);
      const fill = () => {
        const term = sIn.value.trim().toLowerCase();
        const items = [...people.values()].filter(x => !exclude.has(x.id) && (!term || fullName(x).toLowerCase().includes(term) || (x.birthSurname || "").toLowerCase().includes(term))).sort((a, b) => fullName(a).localeCompare(fullName(b))).slice(0, 40);
        list.replaceChildren(...(items.length ? items.map(x => h("button", { "aria-pressed": String(picked === x.id), onclick: () => { picked = x.id; fill(); } }, avatar(x), h("div", {}, h("div", { text: fullName(x) }), h("div", { class: "muted", text: lifeLine(x) || "No dates yet" })))) : [h("div", { class: "muted", text: "No match." })]));
      };
      sIn.addEventListener("input", fill); fill();
      content = h("div", { class: "fld" }, h("label", { for: "a-find", text: "Find someone" }), sIn, list);
      setTimeout(() => sIn.focus(), 30);
    }
    let otherSel = null;
    if (kind === "child") {
      const parts = partnersOf(id);
      if (parts.length) {
        otherSel = parts[0];
        const seg = h("div", { class: "seg" });
        const drawSeg = () => seg.replaceChildren(...[...parts, ""].map(o => h("button", { "aria-pressed": String(otherSel === (o || null)), onclick: () => { otherSel = o || null; drawSeg(); }, text: o ? fullName(P(o)) : "Not listed" })));
        drawSeg();
        content = h("div", {}, content, h("div", { class: "fld", style: "margin-top:12px" }, h("label", { text: "Other parent" }), seg));
      }
    }
    dlg.replaceChildren(
      h("h2", { text: title }), h("div", { class: "muted", text: sub }), tabs, content,
      h("div", { class: "acts" },
        h("button", { class: "btn", onclick: closeModal, text: "Cancel" }),
        h("button", { class: "btn primary", onclick: () => submit(otherSel), text: tab === "new" ? "Add" : "Link" })));
    if (tab === "new") setTimeout(() => $("#a-given")?.focus(), 30);
  };
  const submit = async (otherParent) => {
    let target;
    if (tab === "new") {
      const given = $("#a-given").value.trim(), surname = $("#a-surname").value.trim();
      if (!given && !surname) { $("#a-given").focus(); return toast("Add at least a first name or surname."); }
      target = blank(newId(given + " " + surname));
      target.createdBy = (store.user && store.user.email || "").toLowerCase(); target.createdAt = new Date().toISOString();
      Object.assign(target, { given, surname, birthDate: $("#a-bdate").value.trim(), birthPlace: $("#a-bplace").value.trim() });
      people.set(target.id, target);
    } else {
      if (!picked) return toast("Pick someone from the list.");
      target = P(picked);
    }
    const changed = [target];
    if (kind !== "first") {
      const p = P(id); changed.push(p);
      if (kind === "parent") {
        if (parentsOf(id).length >= 2) return toast("Already has two parents.");
        const existing = parentsOf(id)[0];
        p.parents = [...parentsOf(id), target.id];
        if (existing && !(target.partners || []).includes(existing)) { target.partners = [...(target.partners || []), existing]; const ep = P(existing); ep.partners = [...(ep.partners || []), target.id]; changed.push(ep); }
      } else if (kind === "partner") {
        if (!(p.partners || []).includes(target.id)) p.partners = [...(p.partners || []), target.id];
        if (!(target.partners || []).includes(id)) target.partners = [...(target.partners || []), id];
      } else if (kind === "child") {
        const ps = [id]; if (otherParent) ps.push(otherParent);
        const keep = (target.parents || []).filter(x => !ps.includes(x));
        target.parents = [...ps, ...keep].slice(0, 2);
      } else if (kind === "sibling") {
        if ((target.parents || []).length) { toast(fullName(target) + " already has parents. Link them through a parent instead."); return; }
        target.parents = parentsOf(id).slice();
      }
    }
    closeModal();
    reindex();
    if (kind === "first") { state.focus = target.id; $("#empty").classList.remove("show"); }
    render();
    if (kind === "first") centerOn(target.id, false, true);
    $("#count").textContent = people.size + (people.size === 1 ? " person" : " people");
    if (state.sel) refreshPanel();
    await putAll(changed);
    if (kind === "first") { if (!homeId) await setHome(target.id); select(target.id); }
    if (tab === "new") notifyAdded(target.id, kind === "first" ? "" : kind + " of " + fullName(P(id)));
    toast(fullName(target) + (tab === "new" ? " added" : " linked"));
  };
  draw();
  modal.classList.add("show");
}
function mf(id, label, ph) { return h("div", { class: "fld" }, h("label", { for: id, text: label }), h("input", { id, type: "text", placeholder: ph || "", autocomplete: "off" })); }

init();
})();
</script>
</body>
