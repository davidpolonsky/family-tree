<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Polonsky Family Tree</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The Polonsky family tree">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Archive palette: Wall of Honor slate green, aged paper, brass for the person in focus.
     Layout: full-bleed pan/zoom canvas, slim header, floating controls, detail drawer. */
  --bg:#e9ece7;
  --grid:#d7ddd5;
  --surface:#fbfcfa;
  --ink:#1b2420;
  --muted:#5f6b65;
  --line:#8a968f;
  --accent:#2f4a3e;
  --accent-ink:#f3f6f2;
  --brass:#a87f3e;
  --ok:#3f7a52;
  --story:#b07a1e;
  --research:#6d7f96;
  --danger:#a8423a;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 18px rgba(20,30,25,.08);
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815;--grid:#1c2420;--surface:#1b2420;--ink:#e6ebe7;--muted:#9aa69f;--line:#5b6a62;
    --accent:#8fb8a2;--accent-ink:#0f1512;--brass:#d2a65f;--ok:#7cc492;--story:#e0aa4a;--research:#93a8c4;--danger:#e07a70;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815;--grid:#1c2420;--surface:#1b2420;--ink:#e6ebe7;--muted:#9aa69f;--line:#5b6a62;
  --accent:#8fb8a2;--accent-ink:#0f1512;--brass:#d2a65f;--ok:#7cc492;--story:#e0aa4a;--research:#93a8c4;--danger:#e07a70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--grid)}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap}
.search{position:relative;flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);padding:0 12px 0 34px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto;display:none;padding:4px}
.results.show{display:block}
.results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px;border-radius:8px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results .meta{color:var(--muted);font-size:12px}
.hbtn{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn svg{width:16px;height:16px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--story)} .sync.local i{background:var(--research)}

/* Canvas */
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#world svg path{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#world svg path.couple{stroke:var(--brass);stroke-width:2}

.card{position:absolute;width:184px;height:100px;background:var(--surface);border:1px solid var(--grid);border-radius:14px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:center;padding:10px 12px 10px 10px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line)}
.card.focus{border:2px solid var(--brass);box-shadow:0 0 0 5px color-mix(in srgb,var(--brass) 18%,transparent),var(--shadow)}
.card.research{border-style:dashed}
.ph{flex:none;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:22px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:600;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.yr{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.yr.none{color:var(--muted);font-style:italic}
.pl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.dot.confirmed{background:var(--ok)} .dot.story{background:var(--story)} .dot.research{background:transparent;border:1.5px solid var(--research)}
.role{position:absolute;bottom:-9px;left:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--muted);padding:1px 6px;border-radius:6px;border:1px solid var(--grid)}
.add{position:absolute;width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;line-height:1;box-shadow:var(--shadow);z-index:2}
.add:hover{transform:scale(1.08)}
.add.up{top:-14px;left:78px}.add.down{bottom:-14px;left:78px}.add.right{right:-14px;top:14px}.add.left{left:-14px;top:14px}
.add span{pointer-events:none}

/* Floating controls */
.ctl{position:fixed;left:16px;bottom:16px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:flex;align-items:center;background:var(--surface);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow);height:40px;padding:0 4px}
.pill button{border:0;background:none;height:32px;min-width:32px;border-radius:8px;display:grid;place-items:center}
.pill button:hover{background:var(--bg)}
.pill label{font-size:12px;color:var(--muted);padding:0 6px 0 8px}
.pill output{min-width:16px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.legend{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:14px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{position:static}

/* Panel */
#panel{position:fixed;z-index:40;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
@media (min-width:761px){#panel{top:59px;right:0;bottom:0;width:400px;border-left:1px solid var(--grid);transform:translateX(105%)}#panel.open{transform:none}}
@media (max-width:760px){#panel{left:0;right:0;bottom:0;height:60%;border-radius:18px 18px 0 0;border-top:1px solid var(--grid);transform:translateY(105%)}#panel.open{transform:none}
  .legend{display:none}.brand small{display:none}.brand b{font-size:21px}.hbtn .lbl{display:none}.sync .lbl{display:none}}
.p-head{display:flex;gap:14px;align-items:center;padding:18px 18px 12px;border-bottom:1px solid var(--grid)}
.p-head .big{width:76px;height:76px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--accent) 14%,var(--surface));display:grid;place-items:center;overflow:hidden;font-family:var(--font-display);font-size:32px;color:var(--accent);position:relative}
.p-head .big img{width:100%;height:100%;object-fit:cover}
.p-head h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.p-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.p-head .x{margin-left:auto;align-self:flex-start;border:0;background:none;width:34px;height:34px;border-radius:8px;font-size:22px;color:var(--muted)}
.p-body{overflow:auto;padding:6px 18px 28px;flex:1}
.sec{padding:14px 0;border-bottom:1px solid var(--grid)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld textarea{border:1px solid var(--grid);border-radius:9px;background:var(--bg);padding:8px 10px;min-height:38px;width:100%}
.fld textarea{min-height:92px;resize:vertical;line-height:1.45}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--grid);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg .dot{position:static}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.rel{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rel .lab{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--grid);border-radius:999px;background:var(--bg);overflow:hidden}
.chip button{border:0;background:none;padding:5px 10px;font-size:13px}
.chip button.un{padding:5px 8px 5px 2px;color:var(--muted)}
.chip button.un:hover{color:var(--danger)}
.chip.confirm{border-color:var(--danger)}
.chip.confirm button{color:var(--danger)}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--grid);background:var(--bg);border-radius:9px;padding:7px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:12px}
.photoacts{display:flex;gap:6px;margin-top:8px}
.muted{color:var(--muted);font-size:13px}
.saved{font-size:11px;color:var(--ok);text-transform:none;letter-spacing:0;font-weight:500;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* Modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,12,.38);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(440px,100%);max-height:90%;overflow:auto;padding:20px}
.dlg h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 0 4px}
.dlg .muted{margin-bottom:14px}
.dlg .tabs{display:flex;gap:6px;margin-bottom:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pick{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;margin-top:8px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:6px;border-radius:9px}
.pick button:hover,.pick button[aria-pressed="true"]{background:var(--bg);border-color:var(--grid)}
.pick .ph,.results .ph{width:32px;height:32px;font-size:15px}

/* Toast, banners, empty */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;transition:all .25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}
.banner{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:25;background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);display:none;max-width:92%}
.banner.show{display:block}
.empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px}
.empty.show{display:flex}
.empty h2{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0}
.gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg);
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
.gate.show{display:flex}
.gcard{background:var(--surface);border:1px solid var(--grid);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gcard h2{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
.gcard p{margin:0;line-height:1.5}
.btn.big{padding:11px 18px;font-size:15px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--grid);border-radius:10px;background:var(--bg)}
.mrow .mem{font-weight:500;flex:1;min-width:160px;word-break:break-all}
#world svg path.couple.divorced,#world svg path.couple.separated{stroke-dasharray:6 6;stroke:var(--line)}
#world svg path.couple.widowed{stroke-dasharray:2 5}
.ulabel{position:absolute;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:1px 5px;border-radius:5px;border:1px solid var(--grid);pointer-events:none;white-space:nowrap}
.p-head h2.editable{cursor:text}
.p-head .ename{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0;text-decoration:underline;cursor:pointer}
.chip .ust{font-size:11px;color:var(--muted);padding-right:8px}
@media (max-width:760px){
  .fld input,.fld textarea,.search input,.dlg input{font-size:16px}
  #panel.typing{height:calc(100% - 59px)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="vp"><div id="world"></div></div>

<header>
  <div class="brand"><b>The Family Tree</b><small id="count">Opening the tree</small></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a person" autocomplete="off" aria-label="Find a person">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="hbtn" id="homeBtn" title="Go to the home person"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span class="lbl">Home</span></button>
  <button class="hbtn" id="authBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="lbl">Sign in to edit</span></button>
  <div class="sync" id="sync"><i></i><span class="lbl">Connecting</span></div>
</header>

<div class="banner" id="banner"></div>

<div class="ctl">
  <div class="pill" aria-label="Generations above">
    <label>Up</label>
    <button id="upMinus" aria-label="Show fewer generations above">−</button><output id="upVal">5</output><button id="upPlus" aria-label="Show more generations above">+</button>
  </div>
  <div class="pill" aria-label="Generations below">
    <label>Down</label>
    <button id="dnMinus" aria-label="Show fewer generations below">−</button><output id="dnVal">2</output><button id="dnPlus" aria-label="Show more generations below">+</button>
  </div>
  <div class="pill">
    <button id="zOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <button id="zFit" aria-label="Fit tree to screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="zIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>
</div>

<div class="legend" aria-label="Legend">
  <span><i class="dot confirmed"></i>Documented</span>
  <span><i class="dot story"></i>Family story</span>
  <span><i class="dot research"></i>Needs research</span>
</div>

<div id="gate" class="gate"></div>
<aside id="panel" aria-label="Person details"></aside>
<div id="modal" role="dialog" aria-modal="true"><div class="dlg" id="dlg"></div></div>
<div id="toast" role="status"></div>
<div class="empty" id="empty">
  <h2>Start the tree</h2>
  <p class="muted">Add the first person. Everyone else connects from there.</p>
  <button class="btn primary" id="firstBtn">Add a person</button>
</div>

<script>
(() => {
"use strict";
/* ---------- constants & state ---------- */
const U = 212, CW = 184, CH = 100, RH = 176, PAD = 120;
const STATUS = { confirmed: "Documented", story: "Family story", research: "Needs research" };
const FIELDS = ["given","surname","birthSurname","aka","birthDate","birthPlace","deathDate","deathPlace","notes","sources"];
const people = new Map();
let homeId = null;
const state = { focus: null, sel: null, up: 5, down: 2, readOnly: true };
try { const s = JSON.parse(localStorage.getItem("ft.view") || "{}"); if (s.up != null) state.up = s.up; if (s.down != null) state.down = s.down; } catch {}

const $ = (s, r = document) => r.querySelector(s);
const vp = $("#vp"), world = $("#world"), panel = $("#panel");
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}
const toastEl = $("#toast"); let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2600); }
function setSync(cls, label) { const s = $("#sync"); s.className = "sync " + cls; s.querySelector(".lbl").textContent = label; }
function banner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.classList.toggle("show", !!msg); }

/* ---------- person helpers ---------- */
const P = id => people.get(id);
const fullName = p => p ? ([p.given, p.surname || p.birthSurname].filter(Boolean).join(" ") || "Unnamed") : "Unknown";
const initials = p => { const s = [p.given, p.surname || p.birthSurname].filter(Boolean).join(" ").trim(); if (!s) return "?"; const w = s.split(/\s+/); return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); };
const year = s => { const m = String(s || "").match(/\b(\d{4})\b/); return m ? +m[1] : null; };
function lifeLine(p) {
  const b = year(p.birthDate), d = year(p.deathDate);
  if (b && d) return b + " - " + d;
  if (b) return (p.deathDate ? b + " - ?" : "b. " + b);
  if (d) return "d. " + d;
  if (p.birthDate) return "b. " + p.birthDate;

}

      } else if (kind === "partner") {
        if (!(p.partners || []).includes(target.id)) p.partners = [...(p.partners || []), target.id];

    reindex();

})();
